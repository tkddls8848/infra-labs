[all]
ceph-master ansible_host=192.168.60.10 public_ip=192.168.60.10 cluster_ip=192.168.61.10 ansible_user=vagrant
ceph-worker-1 ansible_host=192.168.60.11 public_ip=192.168.60.11 cluster_ip=192.168.61.11 ansible_user=vagrant osd_devices=/dev/sdb,/dev/sdc
ceph-worker-2 ansible_host=192.168.60.12 public_ip=192.168.60.12 cluster_ip=192.168.61.12 ansible_user=vagrant osd_devices=/dev/sdb,/dev/sdc

[control_plane]
ceph-master

[storage]
ceph-worker-1
ceph-worker-2

[ceph:children]
control_plane
storage

[ceph:vars]
ceph_version=squid
ceph_public_network=192.168.60.0/24
ceph_cluster_network=192.168.61.0/24
# Intentional non-HA lab topology: one monitor; the second manager is only standby.
mon_count=1
mgr_count=2
