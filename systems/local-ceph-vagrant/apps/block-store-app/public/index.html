<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ceph Block Store</title>
<style>
  :root {
    --bg:#f4f5f7; --surface:#fff; --surface-2:#f8fafc; --border:#e3e6ea;
    --text:#1f2733; --text-soft:#6b7686; --primary:#5a4ad1; --primary-600:#4a3cb5;
    --primary-50:#ecebfb; --danger:#d6453d; --danger-50:#fbeceb; --success:#1f9d57;
    --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.06);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  }
  *{box-sizing:border-box;} html,body{margin:0;height:100%;}
  body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;}
  button{font-family:inherit;cursor:pointer;}

  .appbar{display:flex;align-items:center;gap:12px;padding:0 24px;height:60px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;}
  .brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--primary),#7b6fe0);display:grid;place-items:center;color:#fff;}
  .appbar .spacer{flex:1;}
  .hint{font-size:12px;color:var(--text-soft);}

  .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:9px;border:1px solid transparent;font-size:14px;font-weight:600;transition:.15s;white-space:nowrap;}
  .btn-primary{background:var(--primary);color:#fff;} .btn-primary:hover{background:var(--primary-600);} .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--text-soft);border-color:var(--border);} .btn-ghost:hover{background:var(--surface-2);color:var(--text);}
  .btn-danger{background:var(--danger-50);color:var(--danger);} .btn-danger:hover{background:#f7dcda;}
  .btn-sm{padding:6px 11px;font-size:13px;}

  .wrap{max-width:1180px;margin:0 auto;padding:28px 24px;}
  .main{display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start;}
  @media(max-width:820px){.main{grid-template-columns:1fr;}}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
  .panel-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border);}
  .panel-head h2{font-size:15px;margin:0;} .panel-head .spacer{flex:1;}
  .panel-head .count{font-size:12px;color:var(--text-soft);background:var(--surface-2);padding:2px 9px;border-radius:999px;}
  .panel-body{padding:18px;}

  .node{display:flex;align-items:center;gap:10px;padding:12px;border-radius:9px;cursor:pointer;border:1px solid transparent;transition:.12s;margin-bottom:6px;}
  .node:hover{background:var(--surface-2);}
  .node.active{background:var(--primary-50);border-color:var(--primary);}
  .node.offline{opacity:.55;cursor:not-allowed;}
  .node .dot{width:9px;height:9px;border-radius:50%;background:var(--success);flex:none;}
  .node.offline .dot{background:var(--text-soft);}
  .node .meta{overflow:hidden;}
  .node .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .node .st{font-size:12px;color:var(--text-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .dropzone{border:2px dashed var(--border);border-radius:var(--radius);padding:26px;text-align:center;color:var(--text-soft);transition:.15s;margin-bottom:18px;background:var(--surface-2);}
  .dropzone.drag{border-color:var(--primary);background:var(--primary-50);color:var(--primary-600);}
  .dropzone .big{font-size:15px;color:var(--text);margin-bottom:10px;}
  .progress{height:8px;background:var(--border);border-radius:999px;overflow:hidden;margin-top:14px;display:none;}
  .progress-bar{height:100%;width:0;background:var(--primary);transition:width .2s;}

  table{width:100%;border-collapse:collapse;}
  th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--border);}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-soft);font-weight:600;}
  tbody tr:last-child td{border-bottom:none;} tbody tr:hover{background:var(--surface-2);}
  .fname{display:flex;align-items:center;gap:9px;word-break:break-all;}
  td.num{color:var(--text-soft);white-space:nowrap;} td.act{text-align:right;white-space:nowrap;} td.act .btn{margin-left:6px;}
  .empty,.loading{text-align:center;color:var(--text-soft);padding:40px 0;}

  #toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:50;}
  .toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:10px;box-shadow:var(--shadow);padding:12px 16px;min-width:240px;max-width:380px;font-size:13px;animation:s .2s ease;}
  .toast.error{border-left-color:var(--danger);} .toast.success{border-left-color:var(--success);}
  @keyframes s{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
</style>
</head>
<body>
  <div class="appbar">
    <div class="brand"><span class="logo">🧱</span> Ceph Block Store</div>
    <div class="spacer"></div>
    <span class="hint">노드별 RBD 볼륨 · 단일 writer (노드 간 공유 안 됨)</span>
  </div>

  <div class="wrap">
    <div class="main">
      <div class="panel">
        <div class="panel-head"><h2>저장 노드</h2><div class="spacer"></div>
          <button class="btn btn-ghost btn-sm" id="reloadNodes">↻</button>
        </div>
        <div class="panel-body" id="nodeList"><div class="loading">불러오는 중...</div></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2 id="curNode">노드를 선택하세요</h2>
          <span class="count" id="fileCount" style="display:none">0</span>
          <div class="spacer"></div>
          <button class="btn btn-ghost btn-sm" id="refreshBtn" style="display:none">새로고침</button>
        </div>
        <div class="panel-body">
          <div id="filesArea"><div class="empty">왼쪽에서 저장 노드를 선택하면 그 노드의 파일이 표시됩니다.</div></div>
        </div>
      </div>
    </div>
  </div>

  <div id="toasts"></div>

<script>
  const state = { node: null };
  const $ = (id) => document.getElementById(id);
  const dbg = (...a) => console.log('[block-app]', ...a);
  function toast(msg, type='info'){ const e=document.createElement('div'); e.className='toast '+type; e.textContent=msg; $('toasts').appendChild(e); setTimeout(()=>{e.style.opacity='0';setTimeout(()=>e.remove(),250);},4000); }
  function errMsg(d,f){ if(!d) return f; let m=d.error||f; if(d.details) m+=': '+d.details; return m; }
  function fmtSize(b){ if(!b) return '0 B'; const u=['B','KB','MB','GB','TB']; const i=Math.floor(Math.log(b)/Math.log(1024)); return (b/Math.pow(1024,i)).toFixed(i?1:0)+' '+u[i]; }
  function esc(s){ return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  async function loadNodes() {
    const el = $('nodeList');
    el.innerHTML = '<div class="loading">불러오는 중...</div>';
    try {
      const data = await (await fetch('/api/nodes')).json();
      dbg('nodes', data);
      if (!data.nodes.length) { el.innerHTML = '<div class="empty">등록된 노드가 없습니다 (NODES 환경변수 확인).</div>'; return; }
      el.innerHTML = '';
      data.nodes.forEach(n => {
        const d = document.createElement('div');
        d.className = 'node' + (n.online ? '' : ' offline');
        d.innerHTML = `<span class="dot"></span><div class="meta"><div class="nm">${esc(n.name)}</div><div class="st">${n.online ? esc(n.store || '') : 'offline'}</div></div>`;
        if (n.online) d.onclick = () => selectNode(n.name, d);
        el.appendChild(d);
      });
    } catch (e) { el.innerHTML = '<div class="empty">노드 목록 조회 실패</div>'; }
  }

  function selectNode(name, elm) {
    state.node = name;
    document.querySelectorAll('.node').forEach(n => n.classList.remove('active'));
    elm.classList.add('active');
    $('curNode').textContent = name;
    $('refreshBtn').style.display = 'inline-flex';
    loadFiles();
  }

  async function loadFiles() {
    const area = $('filesArea');
    area.innerHTML = '<div class="loading">불러오는 중...</div>';
    try {
      const res = await fetch(`/api/nodes/${encodeURIComponent(state.node)}/files`);
      const data = await res.json();
      dbg('files', res.status, data);
      if (!res.ok) throw new Error(errMsg(data, '목록 조회 실패'));
      renderFiles(data.files);
    } catch (e) { area.innerHTML = `<div class="empty">${e.message}</div>`; }
  }

  function renderFiles(files) {
    $('fileCount').style.display = 'inline-block';
    $('fileCount').textContent = files.length;
    const dz = `<div class="dropzone" id="dropzone"><div class="big">파일을 끌어다 놓거나 클릭해서 선택</div>
      <input type="file" id="fileInput" multiple hidden /><button class="btn btn-primary btn-sm" id="pickBtn">파일 선택</button>
      <div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div></div>`;
    const area = $('filesArea');
    if (!files.length) {
      area.innerHTML = dz + '<div class="empty">이 노드에 파일이 없습니다.</div>';
    } else {
      const rows = files.map(f => `<tr>
        <td><div class="fname">📄 ${esc(f.key)}</div></td>
        <td class="num">${fmtSize(f.size)}</td>
        <td class="num">${new Date(f.lastModified).toLocaleString()}</td>
        <td class="act">
          <button class="btn btn-ghost btn-sm" data-dl="${encodeURIComponent(f.key)}">다운로드</button>
          <button class="btn btn-danger btn-sm" data-del="${encodeURIComponent(f.key)}">삭제</button>
        </td></tr>`).join('');
      area.innerHTML = dz + `<table><thead><tr><th>이름</th><th>크기</th><th>수정일</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
    }
    wireDropzone();
    area.querySelectorAll('[data-dl]').forEach(b => b.onclick = () => { window.location.href = `/api/nodes/${encodeURIComponent(state.node)}/files/${b.dataset.dl}/download`; });
    area.querySelectorAll('[data-del]').forEach(b => b.onclick = () => deleteFile(b.dataset.del));
  }

  function wireDropzone() {
    const dz = $('dropzone'), input = $('fileInput');
    $('pickBtn').onclick = () => input.click();
    input.onchange = () => uploadFiles(Array.from(input.files));
    ['dragover','dragenter'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('drag'); }));
    ['dragleave','dragend'].forEach(ev => dz.addEventListener(ev, () => dz.classList.remove('drag')));
    dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag'); uploadFiles(Array.from(e.dataTransfer.files)); });
  }

  function uploadOne(file) {
    return new Promise((resolve, reject) => {
      const fd = new FormData(); fd.append('file', file);
      const xhr = new XMLHttpRequest(); const bar = $('progressBar'); $('progress').style.display = 'block';
      xhr.upload.onprogress = e => { if (e.lengthComputable) bar.style.width = Math.round(e.loaded/e.total*100)+'%'; };
      xhr.onload = () => { let r={}; try{r=JSON.parse(xhr.responseText);}catch{} dbg('upload', xhr.status, r); xhr.status===200?resolve(r):reject(new Error(errMsg(r,`HTTP ${xhr.status}`))); };
      xhr.onerror = () => reject(new Error('네트워크 오류'));
      xhr.open('POST', `/api/nodes/${encodeURIComponent(state.node)}/files`);
      xhr.send(fd);
    });
  }

  async function uploadFiles(files) {
    if (!files.length || !state.node) return;
    let ok = 0;
    for (const f of files) { $('progressBar').style.width='0'; try { await uploadOne(f); ok++; } catch(e){ toast(`${f.name} 업로드 실패: ${e.message}`, 'error'); } }
    if (ok) toast(`${ok}개 파일을 '${state.node}'에 저장`, 'success');
    loadFiles();
  }

  async function deleteFile(encKey) {
    const key = decodeURIComponent(encKey);
    if (!confirm(`'${state.node}'의 "${key}" 을(를) 삭제할까요?`)) return;
    try {
      const res = await fetch(`/api/nodes/${encodeURIComponent(state.node)}/files/${encKey}`, { method: 'DELETE' });
      const data = await res.json(); dbg('delete', res.status, data);
      if (!res.ok) throw new Error(errMsg(data, '삭제 실패'));
      toast(`"${key}" 삭제됨`, 'success'); loadFiles();
    } catch (e) { toast(e.message, 'error'); }
  }

  $('reloadNodes').onclick = loadNodes;
  $('refreshBtn').onclick = loadFiles;
  loadNodes();
</script>
</body>
</html>
