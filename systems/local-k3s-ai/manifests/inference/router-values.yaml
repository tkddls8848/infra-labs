# router-values.yaml — llm-d 라우터(standalone) 차트에 얹는 이 랩의 오버라이드.
#
# standalone 모드는 Envoy 를 EPP 파드의 사이드카로 넣는다. Istio 나 kgateway
# 같은 Gateway 프로바이더를 따로 설치하지 않아도 되므로 단일 노드 랩에 맞는다.
# 구조는 글 5.2 와 같다:
#
#     요청 → Envoy(8081) ──ext-proc(gRPC, localhost:9002)──▶ EPP
#                │                                            │
#                │        "x-gateway-destination-endpoint"    │
#                ◀────────────────────────────────────────────┘
#                └──▶ 선택된 모델 서버 파드 (ORIGINAL_DST)
#
# Envoy 는 어디로 보낼지 스스로 정하지 않는다. EPP 가 헤더로 찍어 준 주소로
# 보낼 뿐이다. 그 헤더 이름이 위의 x-gateway-destination-endpoint 다.
#
# 상류 기본값 대비 이 랩이 바꾸는 것:
#   - EPP/Envoy 리소스 요청을 워크스테이션 크기로 낮춤 (기본은 각 cpu 4~8, mem 8Gi)
#   - EPP 이미지 태그를 움직이는 `main` 대신 릴리스 태그로 고정
#   - 스케줄링 플러그인을 guides/optimized-baseline 와 같은 조합으로 명시
router:
  # InferencePool 이 고를 대상. 02 단계에서 올린 vLLM 파드의 라벨과 같아야 한다.
  # 여기가 어긋나면 풀이 비어 EPP 가 고를 엔드포인트를 못 찾는다.
  modelServers:
    type: vllm
    protocol: http
    targetPorts:
      - number: 8000
    matchLabels:
      llm-d.ai/model: __MODEL_LABEL__
      llm-d.ai/role: decode

  inferencePool:
    create: true
    # EPP 가 죽어도 트래픽을 통과시킨다. 랩에서 EPP 를 일부러 내려 보고
    # '라우팅만 멍청해지고 서비스는 살아 있다'를 확인할 때 쓰인다.
    failureMode: "FailOpen"

  epp:
    replicas: 1
    image:
      registry: __ROUTER_EPP_IMAGE_REGISTRY__
      repository: __ROUTER_EPP_IMAGE_REPOSITORY__
      # 차트 기본값은 움직이는 `main` 이라 재현되지 않는다. 릴리스 태그로 고정한다.
      tag: __ROUTER_EPP_IMAGE_TAG__
      pullPolicy: IfNotPresent
    extProcPort: 9002
    flags:
      # 후보 엔드포인트와 점수를 로그로 보기 위한 레벨.
      v: __EPP_LOG_VERBOSITY__
    pluginsConfigFile: "lab-plugins.yaml"
    pluginsCustomConfig:
      lab-plugins.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        # 글 5.2 의 "여러 스코어러의 가중 합산" 이 이 목록이다.
        #
        #   approx-prefix-cache-producer  각 엔드포인트가 이 프롬프트의 접두사를
        #                                 얼마나 갖고 있을지 추정한다
        #   inflight-load-producer        처리 중/대기 중 요청을 센다
        #   prefix-cache-affinity-filter  캐시를 가진 후보로 좁힌다. 단, 그 후보가
        #                                 포화되면 좁히기를 포기하고 흩뜨린다
        #   token-load-scorer             남은 후보를 prefill 토큰 부하로 점수화한다
        plugins:
          - type: approx-prefix-cache-producer
          - type: inflight-load-producer
          - type: prefix-cache-affinity-filter
            parameters:
              # 포화 판단 기준(초당 prefill 토큰). 상류 기본값은 H100/32B 기준이라
              # 이 랩의 하드웨어에서는 사실상 '항상 한가함'으로 읽힌다.
              # config/inference.env 의 PEAK_PREFILL_THROUGHPUT 로 바꿔 가며
              # 캐시 친화도와 부하 분산이 어떻게 맞서는지 관찰한다.
              peakPrefillThroughput: __PEAK_PREFILL_THROUGHPUT__
          - type: token-load-scorer
        schedulingProfiles:
          - name: default
            plugins:
              - pluginRef: prefix-cache-affinity-filter
              - pluginRef: token-load-scorer
    resources:
      requests:
        cpu: "__EPP_CPU_REQUEST__"
        memory: "__EPP_MEMORY_REQUEST__"
      limits:
        memory: "__EPP_MEMORY_LIMIT__"

  proxy:
    enabled: true
    proxyType: envoy
    mode: sidecar
    # EPP 가 응답하지 않으면 Envoy 가 그냥 통과시킨다 (라우팅 품질만 잃는다).
    failOpen: true
    resources:
      requests:
        cpu: "__PROXY_CPU_REQUEST__"
        memory: "__PROXY_MEMORY_REQUEST__"
      limits:
        memory: "__PROXY_MEMORY_LIMIT__"
    args:
      - "--service-node"
      - "envoy-proxy"
      # info 로 두면 라우팅된 업스트림이 접근 로그에 남아 실습에서 확인할 수 있다.
      # trace 는 부하가 조금만 늘어도 사이드카 CPU 를 통째로 먹는다.
      - "--log-level"
      - "info"
      - "--concurrency"
      - "2"
      - "--drain-strategy"
      - "immediate"
      - "--drain-time-s"
      - "60"
      - "-c"
      - "/etc/envoy/envoy.yaml"

  extraServicePorts:
    - name: http
      port: 8081
      protocol: TCP
      targetPort: 8081
